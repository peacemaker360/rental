name = "association-rental"
main = "worker/worker.py"
compatibility_date = "2026-06-26"
compatibility_flags = ["python_workers"]

kv_namespaces = [
  { binding = "RENTAL_KV", id = "e6b20c66b9144d03ad713fdb3a00cfd9", preview_id = "5c483cc38f7b49e1b5d9baaf98b52680" }
]

[vars]
# Localhost keeps tenant switching open. Deployed auto mode requires
# RENTAL_CONTEXT_SECRET and signed x-rental-context headers.
RENTAL_AUTH_MODE = "auto"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
