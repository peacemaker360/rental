name = "association-rental-frontdoor"
main = "frontdoor/access_context_worker.js"
compatibility_date = "2026-06-26"
workers_dev = false

routes = [
  { pattern = "rental.kittythecat.ch/api/*", zone_name = "kittythecat.ch" }
]

kv_namespaces = [
  { binding = "RENTAL_KV", id = "e6b20c66b9144d03ad713fdb3a00cfd9", preview_id = "5c483cc38f7b49e1b5d9baaf98b52680" },
  { binding = "TENANT_ACCESS_KV", id = "3e699bb348d544aa8fbd56d69990ec97", preview_id = "64c4c75c68df47858d12892e2fba1e14" }
]

services = [
  { binding = "RENTAL_BACKEND", service = "association-rental" }
]

[[send_email]]
name = "ACCESS_REQUEST_EMAIL"

[vars]
# Set your Clerk publishable key here; store CLERK_SECRET_KEY as a Worker secret.
CLERK_PUBLISHABLE_KEY = "pk_test_YWRhcHRlZC1nb2JibGVyLTk2MTEuY2xlcmsuYWNjb3VudHMuZGV2JA"

# Set to an address on a domain onboarded to Cloudflare Email Sending.
ACCESS_REQUEST_FROM = ""
