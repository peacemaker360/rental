name: Cloudflare refactor CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Python tests
        run: npm test

      - name: Run signed local smoke
        run: npm run smoke:signed

      - name: Validate Cloudflare deployment shape
        run: python3 scripts/deploy_preflight.py --allow-placeholders --include-frontdoor

      - name: Check JavaScript syntax
        run: npm run check:js
